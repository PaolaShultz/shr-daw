[package]
name = "shr-daw"
version = "0.4.7"
edition = "2021"
rust-version = "1.97"
description = "Raspberry Pi mini DAW with a Rust TUI, FT2-style MIDI tracker, routing, synth hosts, loops, and recording"
license = "MIT"

[[bin]]
name = "shr"
path = "src/main.rs"

[dependencies]
alsa = "0.7.1"
anyhow = "1.0"
crossterm = "0.26"
hound = "3.5"
libc = "0.2"
midir = "0.9"
quick-xml = "0.41"
ratatui = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
shr-drums = { path = "../shr-drums/crates/shr-drums" }
toml = "0.9"
unicode-width = "0.1"

[profile.release]
strip = true
lto = true
codegen-units = 1

# The repository-local launcher deliberately runs target/debug/shr. Retain
# assertions and debug symbols, but optimize the production DSP callbacks so
# the DEV artifact can still meet JACK's real-time deadline.
[profile.dev]
opt-level = 2

# Keep the full unit suite quick to compile and fully instrumented. Runnable
# DEV/REL callback performance is measured separately.
[profile.test]
opt-level = 0
