[package]
name = "shr-daw"
version = "0.4.8"
edition = "2021"
rust-version = "1.97"
description = "Raspberry Pi mini DAW with a Rust TUI, FT2-style MIDI tracker, routing, synth hosts, loops, and recording"
license = "MIT"

[[bin]]
name = "shr"
path = "src/main.rs"

[dependencies]
alsa = "0.7.1"
anyhow = "1.0"
crossterm = "0.26"
hound = "3.5"
libc = "0.2"
midir = "0.9"
quick-xml = "0.41"
ratatui = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
shr-drums = { git = "https://github.com/PaolaShultz/shr-drums.git", rev = "0199297b3efd160a67e3f47df64a6bf418c20df2", version = "=0.2.0" }
toml = "0.9"
unicode-width = "0.1"

[profile.release]
strip = true
lto = true
codegen-units = 1

# An explicit SHSYNTH_BIN=target/debug/shr development launch retains
# assertions and debug symbols. Optimize the production DSP callbacks so the
# DEV artifact can still meet JACK's real-time deadline; the default local
# launcher uses target/release/shr.
[profile.dev]
opt-level = 2

# Keep the full unit suite quick to compile and fully instrumented. Runnable
# DEV/REL callback performance is measured separately.
[profile.test]
opt-level = 0
