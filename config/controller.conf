# SHR-DAW generic controller mapping v9.
# `shr-setup` applies a matching profile or offers MIDI learn. Keeping this
# template empty prevents an unknown controller from inheriting another
# device's notes and CCs.
profile=
menu.layout=8
encoder.relative_cc=
encoder.relative_reverse=false
encoder.modified_relative_cc=
encoder.modified_relative_reverse=false
encoder.press_cc=
encoder.press_note=
encoder.press_channel=
synth.press_cc=
synth.press_note=
synth.press_channel=
encoder.modifier=
lock.cc=
# Physical positions own MIDI messages; screens and instruments own meanings:
# pot.1=74
# pot.15=34
# synth.press_cc=35
# pad.1=note.10.36
# pad.5=cc.10.44
# Use `any` instead of a channel number only for legacy devices that cannot be
# channel-qualified, for example `pad.1=note.any.36`.
